<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rain on Glass — raindrop-fx demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/SardineFish/raindrop-fx/bundle/index.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  #root {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

  #canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  #status {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    color: #ddd;
    text-align: center;
    padding: 2rem;
    font-size: 14px;
    line-height: 1.5;
    background: #0a0e0c;
  }

  #status code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* ---------- Centered player stage ---------- */
  #centerStage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    color: #fff;
    text-align: center;
    padding: 0 20px;
  }

  .play-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .play-halo {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.05) 55%, rgba(255,255,255,0) 76%);
    pointer-events: none;
  }

  #playBtn {
    width: 116px;
    height: 116px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.92);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  #playBtn:hover { background: rgba(255,255,255,0.08); }
  #playBtn:active { transform: scale(0.97); }

  .icon-play {
    width: 0;
    height: 0;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    border-left: 28px solid #fff;
    margin-left: 6px;
  }

  .icon-pause {
    display: flex;
    gap: 9px;
  }

  .icon-pause span {
    width: 9px;
    height: 34px;
    background: #fff;
    border-radius: 2px;
    display: block;
  }

  #volumeRow {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #volume {
    -webkit-appearance: none;
    appearance: none;
    width: 220px;
    height: 2px;
    background: rgba(255,255,255,0.55);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  #volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }

  #volume::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #fff;
    border: none;
    cursor: pointer;
  }

  #volume::-moz-range-track {
    background: rgba(255,255,255,0.55);
    height: 2px;
    border-radius: 2px;
  }

  #chooseAudio {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 4px;
  }

  #chooseAudio:hover { color: #fff; }

  #title {
    font-family: "Marcellus", Georgia, serif;
    font-size: clamp(38px, 7vw, 68px);
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 4px 0 0;
    text-shadow: 0px 0px 15px rgba(0,0,0,0.35);
  }

  #subtitle {
    font-family: "Marcellus", Georgia, serif;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-top: -6px;
  }

  #trackName {
    font-size: 11px;
    opacity: 0.5;
    margin-top: -14px;
  }

  /* ---------- Tucked-away rain settings ---------- */
  #settingsToggle {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(10, 14, 12, 0.5);
    color: #e8ece9;
    font-size: 16px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }

  #settingsToggle:hover { background: rgba(10, 14, 12, 0.75); }

  #settingsPanel {
    position: absolute;
    top: 66px;
    right: 20px;
    display: none;
    padding: 14px 16px;
    background: rgba(10, 14, 12, 0.6);
    backdrop-filter: blur(6px);
    border-radius: 10px;
    color: #e8ece9;
    font-size: 13px;
    width: 210px;
  }

  #settingsPanel.open { display: block; }

  #settingsPanel label {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    opacity: 0.85;
  }

  #settingsPanel input[type="range"] {
    width: 110px;
    height: auto;
  }

  /* ---------- Weather tabs ---------- */
  #weatherTabs {
    position: absolute;
    top: 20px;
    right: 66px;
    display: flex;
    gap: 8px;
  }

  .weatherTab {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(10, 14, 12, 0.5);
    color: #e8ece9;
    font-size: 15px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    opacity: 0.6;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .weatherTab:hover { opacity: 0.9; }

  .weatherTab.active {
    opacity: 1;
    background: rgba(255, 255, 255, 0.18);
  }

  /* ---------- Background layers used by snow/sunny (rain draws its own bg) ---------- */
  #bgImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  #snowCanvas,
  #sunCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    pointer-events: none;
  }

  #sunTint {
    position: absolute;
    inset: 0;
    display: none;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="root">
  <img id="bgImage" alt="">
  <canvas id="canvas"></canvas>
  <canvas id="snowCanvas"></canvas>
  <div id="sunTint"></div>
  <canvas id="sunCanvas"></canvas>
</div>

<div id="status"></div>

<div id="centerStage">
  <div class="play-wrap">
    <div class="play-halo"></div>
    <button id="playBtn" title="Play / pause">
      <span id="playIcon" class="icon-play"></span>
    </button>
  </div>

  <div id="volumeRow">
    <input id="volume" type="range" min="0" max="100" value="55">
    <button id="chooseAudio" title="Choose your own audio file">&#127925;</button>
  </div>

  <!-- Rename these two lines to make it yours -->
  <h1 id="title">Quiet Rain</h1>
  <div id="subtitle">a calmer corner of the internet</div>
  <div id="trackName" hidden></div>

</div>

<div id="weatherTabs">
  <button class="weatherTab active" data-weather="rain" title="Rain">&#127783;&#65039;</button>
  <button class="weatherTab" data-weather="snow" title="Snow">&#10052;&#65039;</button>
  <button class="weatherTab" data-weather="sunny" title="Sunny">&#9728;&#65039;</button>
</div>
<button id="settingsToggle" title="Weather settings">&#9881;</button>
<div id="settingsPanel">
  <div class="settings-group" data-weather="rain">
    <label>drops/sec <input id="rate" type="range" min="0" max="2000" value="600"></label>
    <label>droplet size <input id="size" type="range" min="20" max="150" value="80"></label>
    <label>mist <input id="mist" type="checkbox" checked></label>
  </div>
  <div class="settings-group" data-weather="snow" style="display:none">
    <label>flakes <input id="snowCount" type="range" min="20" max="400" value="150"></label>
    <label>flake size <input id="snowSize" type="range" min="1" max="6" value="3"></label>
    <label>wind <input id="snowWind" type="range" min="-3" max="3" step="0.1" value="0"></label>
  </div>
  <div class="settings-group" data-weather="sunny" style="display:none">
    <label>warmth <input id="sunWarmth" type="range" min="0" max="100" value="55"></label>
    <label>rays <input id="sunRays" type="checkbox" checked></label>
  </div>
</div>

<audio id="rainAudio" loop preload="none" src="audio/rain.mp3"></audio>
<audio id="weatherAudioLayer2" loop preload="none"></audio>
<input type="file" id="audioFile" accept="audio/*" style="display:none">

  // ---------- Snow (own lightweight canvas particle sim, no external lib) ----------
  function createSnow(snowCanvasEl) {
    const ctx = snowCanvasEl.getContext("2d");
    let flakes = [];
    let running = false;
    let raf = null;
    let config = { count: 150, size: 3, wind: 0 };

    function resize() {
      const rect = snowCanvasEl.getBoundingClientRect();
      snowCanvasEl.width = rect.width;
      snowCanvasEl.height = rect.height;
    }

    function seed() {
      flakes = Array.from({ length: config.count }, () => ({
        x: Math.random() * snowCanvasEl.width,
        y: Math.random() * snowCanvasEl.height,
        r: Math.random() * config.size + 1,
        speedY: Math.random() * 1 + 0.5,
        drift: Math.random() * 0.6 - 0.3,
        opacity: Math.random() * 0.5 + 0.4,
      }));
    }

    function tick() {
      ctx.clearRect(0, 0, snowCanvasEl.width, snowCanvasEl.height);
      ctx.fillStyle = "#fff";
      for (const f of flakes) {
        ctx.globalAlpha = f.opacity;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
        f.y += f.speedY;
        f.x += f.drift + config.wind * 0.3;
        if (f.y > snowCanvasEl.height + 5) {
          f.y = -5;
          f.x = Math.random() * snowCanvasEl.width;
        }
        if (f.x > snowCanvasEl.width + 5) f.x = -5;
        if (f.x < -5) f.x = snowCanvasEl.width + 5;
      }
      ctx.globalAlpha = 1;
      if (running) raf = requestAnimationFrame(tick);
    }

    return {
      start() {
        resize();
        seed();
        running = true;
        tick();
      },
      stop() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        ctx.clearRect(0, 0, snowCanvasEl.width, snowCanvasEl.height);
      },
      resize() {
        if (running) resize();
      },
      updateConfig(next) {
        const countChanged = "count" in next && next.count !== config.count;
        config = { ...config, ...next };
        if (countChanged) seed();
      },
    };
  }

  const snowFx = createSnow(document.querySelector("#snowCanvas"));

  document.querySelector("#snowCount").addEventListener("input", (e) => {

  // ---------- Sunny (warm color tint + slow rotating rays + drifting dust motes) ----------
  function createSunny(sunCanvasEl, tintEl) {
    const ctx = sunCanvasEl.getContext("2d");
    let motes = [];
    let running = false;
    let raf = null;
    let t = 0;
    let config = { warmth: 55, rays: true };

    function resize() {
      const rect = sunCanvasEl.getBoundingClientRect();
      sunCanvasEl.width = rect.width;
      sunCanvasEl.height = rect.height;
    }

    function seed() {
      motes = Array.from({ length: 40 }, () => ({
        x: Math.random() * sunCanvasEl.width,
        y: Math.random() * sunCanvasEl.height,
        r: Math.random() * 1.6 + 0.6,
        speed: Math.random() * 0.3 + 0.1,
        drift: Math.random() * 0.4 - 0.2,
        opacity: Math.random() * 0.4 + 0.2,
      }));
    }

    function applyTint() {
      const alpha = (config.warmth / 100) * 0.35;
      tintEl.style.background =
        `linear-gradient(200deg, rgba(255,190,110,${alpha}) 0%, rgba(255,150,60,${alpha * 0.6}) 45%, rgba(0,0,0,0) 80%)`;
    }

    function tick() {
      ctx.clearRect(0, 0, sunCanvasEl.width, sunCanvasEl.height);
      t += 0.003;

      if (config.rays) {
        ctx.save();
        ctx.translate(sunCanvasEl.width * 0.78, sunCanvasEl.height * 0.18);
        ctx.rotate(t);
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          const grad = ctx.createLinearGradient(0, 0, Math.cos(a) * sunCanvasEl.width, Math.sin(a) * sunCanvasEl.width);
          grad.addColorStop(0, "rgba(255,225,170,0.14)");
          grad.addColorStop(1, "rgba(255,225,170,0)");
          ctx.strokeStyle = grad;
          ctx.lineWidth = 60;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * sunCanvasEl.width, Math.sin(a) * sunCanvasEl.width);
          ctx.stroke();
        }
        ctx.restore();
      }

      ctx.fillStyle = "#fff6e0";
      for (const m of motes) {
        ctx.globalAlpha = m.opacity;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
        m.y -= m.speed;
        m.x += m.drift;
        if (m.y < -5) {
          m.y = sunCanvasEl.height + 5;
          m.x = Math.random() * sunCanvasEl.width;
        }
      }
      ctx.globalAlpha = 1;

      if (running) raf = requestAnimationFrame(tick);
    }

    return {
      start() {
        resize();
        seed();
        applyTint();
        running = true;
        tick();
      },
      stop() {
        running = false;
        if (raf) cancelAnimationFrame(raf);
        ctx.clearRect(0, 0, sunCanvasEl.width, sunCanvasEl.height);
      },
      resize() {
        if (running) resize();
      },
      updateConfig(next) {
        config = { ...config, ...next };
        applyTint();
      },
    };
  }

  const sunFx = createSunny(document.querySelector("#sunCanvas"), document.querySelector("#sunTint"));

  // ---------- Weather switcher ----------
  const weatherTabButtons = document.querySelectorAll(".weatherTab");
  const settingsGroups = document.querySelectorAll(".settings-group");
  const bgImageEl = document.querySelector("#bgImage");
  const snowCanvasEl = document.querySelector("#snowCanvas");
  const sunCanvasEl = document.querySelector("#sunCanvas");
  const sunTintEl = document.querySelector("#sunTint");
  const titleEl = document.querySelector("#title");
  const subtitleEl = document.querySelector("#subtitle");

  // Edit these three to change what shows on screen for each weather.
  const weatherText = {
    rain: { title: "Quiet Rain", subtitle: "a calmer corner of the internet" },
    snow: { title: "Quiet Snow", subtitle: "a hush over everything" },
    sunny: { title: "Quiet Sun", subtitle: "a warm afternoon lull" },
  };

  let currentWeather = "rain";

  function setWeather(weather) {
    currentWeather = weather;
    weatherTabButtons.forEach((btn) => btn.classList.toggle("active", btn.dataset.weather === weather));
    settingsGroups.forEach((g) => { g.style.display = g.dataset.weather === weather ? "" : "none"; });

    canvas.style.display = weather === "rain" ? "block" : "none";
    bgImageEl.style.display = weather === "rain" ? "none" : "block";
    snowCanvasEl.style.display = weather === "snow" ? "block" : "none";
    sunTintEl.style.display = weather === "sunny" ? "block" : "none";
    sunCanvasEl.style.display = weather === "sunny" ? "block" : "none";

    titleEl.textContent = weatherText[weather].title;
    subtitleEl.textContent = weatherText[weather].subtitle;

    if (weather === "snow") snowFx.start(); else snowFx.stop();
    if (weather === "sunny") sunFx.start(); else sunFx.stop();

    switchAudioForWeather(weather);
  }

  weatherTabButtons.forEach((btn) => {
    btn.addEventListener("click", () => setWeather(btn.dataset.weather));
  });

  window.addEventListener("resize", () => {
    snowFx.resize();
    sunFx.resize();
  });

  // ---------- Settings popover ----------
  const settingsToggle = document.querySelector("#settingsToggle");
  const settingsPanel = document.querySelector("#settingsPanel");
  settingsToggle.addEventListener("click", () => {
    settingsPanel.classList.toggle("open");
  });

  // ---------- Audio: your own file, either baked in or picked live ----------
  const audioEl = document.querySelector("#rainAudio");        // layer 1
  const audioEl2 = document.querySelector("#weatherAudioLayer2"); // layer 2 (optional per weather)
  const audioEls = [audioEl, audioEl2];
  const playBtn = document.querySelector("#playBtn");
  const playIcon = document.querySelector("#playIcon");
  const volumeSlider = document.querySelector("#volume");
  const trackName = document.querySelector("#trackName");
  const chooseAudioBtn = document.querySelector("#chooseAudio");
  const fileInput = document.querySelector("#audioFile");

  audioEls.forEach((el) => { el.volume = volumeSlider.value / 100; });

  // Default tracks per weather. Each weather gets an ARRAY of one or two layers
  // that play together (e.g. snow = a wind bed + a snowfall/foley texture).
  // Drop matching files in audio/ and they'll be picked up automatically; a
  // missing file just shows "not found" for that weather instead of breaking.
  const audioSources = {
    rain: [
      { src: "audio/rain.mp3", name: "audio/rain.mp3", isDefault: true },
    ],
    snow: [
      { src: "audio/snow.mp3", name: "audio/snow.mp3", isDefault: true },
    ],
    sunny: [
      { src: "audio/sunny.mp3", name: "audio/sunny.mp3", isDefault: true },
    ],
  };

  let isPlaying = false;

  function switchAudioForWeather(weather) {
    const wasPlaying = isPlaying;
    const tracks = audioSources[weather];

    audioEls.forEach((el, i) => {
      const track = tracks[i];
      if (track) {
        el.dataset.active = "true";
        el.src = track.src;
        el.load();
      } else {
        el.dataset.active = "false";
        el.pause();
        el.removeAttribute("src");
      }
    });

    trackName.textContent = tracks.map((t) => t.name).join("  +  ");

    if (wasPlaying) {
      audioEls.forEach((el) => {
        if (el.dataset.active === "true") el.play().catch((err) => console.error("Playback failed:", err));
      });
    }
  }

  function setPlayingIcon(isPlaying) {
    if (isPlaying) {
      playIcon.className = "icon-pause";
      playIcon.innerHTML = "<span></span><span></span>";
    } else {
      playIcon.className = "icon-play";
      playIcon.innerHTML = "";
    }
  }

  audioEls.forEach((el) => {
    el.addEventListener("error", () => {
      if (el.dataset.active !== "true") return;
      const tracks = audioSources[currentWeather];
      if (tracks.some((t) => t.isDefault)) {
        trackName.textContent = `no default track found for ${currentWeather} — pick one below`;
      }
    });
  });

  // Track playback state ourselves so swapping audio sources between weather modes
  // cannot desynchronize the play/pause icon from the user's actual toggle state.
  setPlayingIcon(false);

  playBtn.addEventListener("click", async () => {
    const activeEls = audioEls.filter((el) => el.dataset.active === "true");
    if (!activeEls.length) return;

    if (isPlaying) {
      activeEls.forEach((el) => el.pause());
      isPlaying = false;
      setPlayingIcon(false);
      return;
    }

    try {
      await Promise.all(activeEls.map((el) => el.play()));
      isPlaying = true;
      setPlayingIcon(true);
    } catch (err) {
      isPlaying = false;
      setPlayingIcon(false);
      console.error("Playback failed:", err);
    }
  });

  volumeSlider.addEventListener("input", (e) => {
    const v = e.target.value / 100;
    audioEls.forEach((el) => { el.volume = v; });
  });

  chooseAudioBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    // A manual pick replaces this weather's layers with just the one file you chose.
    audioSources[currentWeather] = [{ src: url, name: file.name, isDefault: false }];
    switchAudioForWeather(currentWeather);
    audioEls.forEach((el) => {
      if (el.dataset.active === "true") el.play().catch((err) => console.error("Playback failed:", err));
    });
  });

  // Establish layer state for the starting weather (rain) right away, so the
  // play button and volume slider work before the user ever taps a weather tab.
  switchAudioForWeather(currentWeather);
</script>

</body>
</html>
